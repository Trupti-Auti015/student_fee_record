    <h3>Update Amount Paid</h3>

<form action="/update" method="POST">
    Fee ID:
    <input type="number" name="Fee_ID" min="1" required>
    <br><br>

    New Amount Paid:
    <input type="number" name="Amount_Paid" step="0.01" min="1" required>
    <br><br>

    <input type="submit" value="Update Amount">
</form>
